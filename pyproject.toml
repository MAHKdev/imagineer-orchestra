[project]
name = "concerto"
authors = [
    { name = "Imagineer", email = "hello@imagineer.solutions" }
]
description = "Concerto — Orchestra AI bridge for ERPNext. One install embeds the Orchestra AI chat with per-user credentials."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=15.0.0" # Installed and managed by bench.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

# Advertise compatible Frappe versions — required by Frappe Cloud to accept the app.
[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"

# These apt dependencies will be installed from Ubuntu repositories when you host your app on Frappe Cloud
[deploy.dependencies.apt]
packages = []

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
